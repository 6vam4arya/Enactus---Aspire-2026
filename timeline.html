<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        .font-oswald { font-family: 'Oswald', sans-serif; }
    </style>
</head>
<body class="bg-[#1a1a1a] min-h-screen flex flex-col items-center justify-center p-8 font-sans antialiased overflow-x-hidden">

<h1 class="font-oswald text-white text-6xl md:text-8xl font-bold tracking-wider mb-40 uppercase text-center w-full">
    Timeline
</h1>

<div class="relative w-full max-w-6xl mx-auto px-4 md:px-8">
    <div class="absolute left-4 right-4 md:left-8 md:right-8 h-1 bg-[#ffc600] top-1/2 -translate-y-1/2 z-0"></div>

    <div id="timeline-container" class="flex justify-between w-full relative z-10">
    </div>
</div>

<script>
    // Dummy data: I've set dates around late February 2026.
    // Change these ISO strings to test different states!
    const eventsData = [
        { id: 1, title: 'Event 1', date: '2026-02-20T10:00:00', tooltipTitle: 'Event 1', desc: 'Details about the event.' },
        { id: 2, title: 'Event 2', date: '2026-02-24T12:00:00', tooltipTitle: 'Event 2', desc: 'Details about the event.' },
        { id: 3, title: 'Event 3', date: '2026-02-27T09:00:00', tooltipTitle: 'Event 3', desc: 'Details about the event.' },
        { id: 4, title: 'Event 4', date: '2026-02-28T20:00:00', tooltipTitle: 'Event 4', desc: 'Details about the event.' },
        { id: 5, title: 'Event 5', date: '2026-03-01T10:00:00', tooltipTitle: 'Event 5', desc: 'Details about the event.' },
        { id: 6, title: 'Event 6', date: '2026-03-05T10:00:00', tooltipTitle: 'Event 6', desc: 'Details about the event.' },
        { id: 7, title: 'Event 7', date: '2026-03-10T10:00:00', tooltipTitle: 'Event 7', desc: 'Details about the event.' },
        { id: 8, title: 'Event 8', date: '2026-03-15T10:00:00', tooltipTitle: 'Event 8', desc: 'Details about the event.' }
    ];

    function renderTimeline() {
        const container = document.getElementById('timeline-container');
        const now = new Date();
        let activeIndex = -1;
        for (let i = eventsData.length - 1; i >= 0; i--) {
            if (new Date(eventsData[i].date) <= now) {
                activeIndex = i;
                break;
            }
        }
        if (activeIndex === -1) activeIndex = 0;

        let htmlContent = '';

        eventsData.forEach((event, index) => {
            const isCurrent = index === activeIndex;
            const isPast = index < activeIndex;
            const isFuture = index > activeIndex;
            const isLabelBottom = index % 2 === 0;
            const labelPosClass = isLabelBottom ? 'top-10' : 'bottom-10';
            const tooltipPosClass = isLabelBottom ? 'bottom-8' : 'top-8';
            const tooltipArrowClass = isLabelBottom
                ? "after:top-full after:border-t-gray-800 translate-y-2 group-hover:translate-y-0"
                : "after:bottom-full after:border-b-gray-800 -translate-y-2 group-hover:translate-y-0";

            let dotHtml = '';
            let labelClasses = '';

            if (isCurrent) {
                dotHtml = `
                        <div class="w-8 h-8 rounded-full border-[3px] border-[#ffc600] bg-[#1a1a1a] absolute z-10 flex items-center justify-center shadow-[0_0_15px_rgba(255,198,0,0.4)]">
                            <svg class="w-3 h-3 fill-[#ffc600] rotate-45 translate-x-[1px]" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                        </div>`;
                labelClasses = 'bg-[#ffc600] text-black px-5 py-1.5 rounded-md';
            } else {
                dotHtml = `<div class="w-4 h-4 bg-[#ffc600] rounded-full absolute z-10 ${isPast ? 'shadow-[0_0_10px_rgba(255,198,0,0.3)]' : ''}"></div>`;
                labelClasses = isPast ? 'text-[#ffc600]' : 'text-white';
            }

            htmlContent += `
                    <div class="relative w-0 h-0 flex items-center justify-center group cursor-pointer">
                        ${dotHtml}

                        <div class="absolute ${labelPosClass} whitespace-nowrap font-oswald text-2xl font-bold uppercase tracking-wide transition-colors duration-300 ${labelClasses}">
                            ${event.title}
                        </div>

                        <div class="absolute ${tooltipPosClass} opacity-0 group-hover:opacity-100 transition-all duration-300 w-48 bg-gray-800 text-white rounded-lg p-4 shadow-xl z-50 pointer-events-none text-center border border-gray-700 after:content-[''] after:absolute after:left-1/2 after:-translate-x-1/2 after:border-[6px] after:border-transparent ${tooltipArrowClass}">
                            <p class="font-bold text-[#ffc600] mb-1 font-oswald text-lg tracking-wide">${event.tooltipTitle}</p>
                            <p class="text-xs text-gray-300 leading-relaxed">${event.desc}</p>
                            <p class="text-[10px] text-gray-500 mt-2">${new Date(event.date).toLocaleDateString()}</p>
                        </div>
                    </div>
                `;
        });

        container.innerHTML = htmlContent;
    }

    renderTimeline();

    setInterval(renderTimeline, 60000);
</script>
</body>

</html>
